  <path class="flow" d="M510 817H450"/>
  <text class="note" x="480" y="804">SSH</text>
  <rect class="node" x="50" y="965" width="860" height="153"/>
  <text class="heading" x="480.0" y="998">dev1 … dev5 · sesiones tmux por usuario</text>
  <text class="" x="480.0" y="1032">Gentle Shell + Pi + herramientas y subagentes</text>
  <text class="note" x="480.0" y="1058">Los procesos ejecutan aquí, no en la computadora del usuario</text>
  <text class="note" x="480.0" y="1084">tmux conserva la sesión al desconectarse, no ante un reinicio</text>
  <path class="flow" d="M240 864V930H480V965"/>
  <rect class="node" x="30" y="1193" width="420" height="231"/>
  <text class="heading" x="240.0" y="1226">Herramientas y Kit compartidos</text>
  <text class="" x="240.0" y="1260">/opt/gentle-shell</text>
  <text class="" x="240.0" y="1286">/srv/migraciones/kit</text>
  <text class="note" x="240.0" y="1312">Root administra; usuarios leen y</text>
  <text class="note" x="240.0" y="1338">ejecutan</text>
  <text class="note" x="240.0" y="1364">Estrategia, plantillas, mig-case y</text>
  <text class="note" x="240.0" y="1390">utilidades</text>
  <rect class="node" x="510" y="1193" width="420" height="153"/>
  <text class="heading" x="720.0" y="1226">Configuración personal</text>
  <text class="" x="720.0" y="1260">~/.gentle-shell/agent</text>
  <text class="note" x="720.0" y="1286">Credenciales propias de IA, GitHub y</text>
  <text class="note" x="720.0" y="1312">Odoo.sh; no se comparten</text>
  <path class="flow" d="M480 1118V1158H240V1193"/>
  <path class="flow" d="M480 1158H720V1193"/>
  <rect class="node" x="50" y="1499" width="860" height="127"/>
  <text class="heading" x="480.0" y="1532">Casos · /srv/migraciones/cases/MIG-CLIENTE-001</text>
  <text class="" x="480.0" y="1566">Intake · tablero · runbook · clones y worktrees</text>
  <text class="note" x="480.0" y="1592">Un coordinador por caso; lock operativo, no barrera de seguridad</text>
  <path class="flow" d="M240 1424V1499"/>
  <path class="flow" d="M720 1346V1499"/>
  <rect class="pending" x="50" y="1701" width="860" height="127"/>
  <text class="heading" x="480.0" y="1734">Engram instalado · activación y aislamiento pendientes</text>
  <text class="note" x="480.0" y="1768">No es una memoria compartida validada.</text>
  <text class="note" x="480.0" y="1794">El tablero y el runbook mantienen la continuidad.</text>
  <rect class="node" x="50" y="1888" width="860" height="127"/>
  <text class="heading" x="480.0" y="1921">Servicios que conviven</text>
  <text class="" x="480.0" y="1955">Buzz y Odoo existentes</text>
  <text class="note" x="480.0" y="1981">Sin reconfiguración por esta solución</text>
  <path class="flow" d="M480 1626V1656H940V2090H160V2180H800"/>
  <text class="heading" x="480" y="2135">Servicios externos · accesos personales</text>
  <text class="note" x="480" y="2163">Operaciones autorizadas según la etapa</text>
  <path class="flow" d="M160 2180V2205"/>
  <path class="flow" d="M480 2180V2205"/>
  <path class="flow" d="M800 2180V2205"/>
  <rect class="node" x="20" y="2205" width="280" height="231"/>
  <text class="heading" x="160.0" y="2238">Proveedor de IA</text>
  <text class="" x="160.0" y="2272">Inferencia y</text>
  <text class="" x="160.0" y="2298">respuestas del modelo</text>
  <text class="note" x="160.0" y="2324">Recibe el contexto</text>
  <text class="note" x="160.0" y="2350">autorizado del agente</text>
  <text class="note" x="160.0" y="2376">No ejecuta directamente</text>
  <text class="note" x="160.0" y="2402">los comandos SSH</text>
  <rect class="node" x="340" y="2205" width="280" height="205"/>
  <text class="heading" x="480.0" y="2238">GitHub</text>
  <text class="" x="480.0" y="2272">Repositorios y ramas</text>
  <text class="" x="480.0" y="2298">autorizadas</text>
  <text class="note" x="480.0" y="2324">Lectura para diagnóstico</text>
  <text class="note" x="480.0" y="2350">Commit y push requieren</text>
  <text class="note" x="480.0" y="2376">permiso</text>
  <rect class="node" x="660" y="2205" width="280" height="289"/>
  <text class="heading" x="800.0" y="2238">Odoo.sh /</text>
  <text class="heading" x="800.0" y="2267">actualización de</text>
  <text class="heading" x="800.0" y="2296">base</text>
  <text class="" x="800.0" y="2330">Origen: lectura</text>
  <text class="" x="800.0" y="2356">Development: pruebas</text>
  <text class="note" x="800.0" y="2382">Staging: historia con</text>
  <text class="note" x="800.0" y="2408">base actualizada</text>
  <text class="note" x="800.0" y="2434">Código y migración de</text>
  <text class="note" x="800.0" y="2460">datos por separado</text>
  <text class="note" x="480" y="2539">La Mac administra; PC-ALE ejecuta. El usuario no pasa por la Mac.</text>
  <text class="note" x="480" y="2569">Sin direcciones privadas ni credenciales.</text>
  <text class="note" x="480" y="2599">Acceso técnico no equivale a autorización de migración.</text>
</svg>
