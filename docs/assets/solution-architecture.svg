<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 2629" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura: Mac de Ale, usuarios y PC-ALE</title>
  <desc id="desc">La Mac de Ale administra PC-ALE mediante SSH y conserva Tailscale como acceso de respaldo. Los usuarios de Windows, Linux y macOS se autentican en Cloudflare Access y se conectan por el túnel existente a sus cuentas SSH. En PC-ALE, cada usuario ejecuta Gentle Shell con Pi y subagentes dentro de tmux, utiliza un kit de solo lectura y trabaja en casos compartidos con un coordinador por caso. Las credenciales son personales. Desde PC-ALE se accede al proveedor de IA, GitHub y Odoo.sh según los permisos. Engram requiere validar activación y aislamiento. Buzz y Odoo existentes conviven sin reconfiguración.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#626a73"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #212326; font-size: 20px; text-anchor: middle; }
      .title { font-size: 26px; font-weight: 750; fill: #750014; }
      .heading { font-size: 22px; font-weight: 700; }
      .note { font-size: 18px; fill: #626a73; }
      .node, .task { fill: #f2f4f8; stroke: #626a73; stroke-width: 1.5; rx: 8; }
      .boundary { fill: #fff; stroke: #750014; stroke-width: 2; rx: 10; }
      .pending { fill: #fff; stroke: #626a73; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 8; }
      .lane { fill: #fff; stroke: #dde1e6; }
      .gateway, .event { fill: #fff; stroke: #750014; stroke-width: 2; }
      .flow { fill: none; stroke: #626a73; stroke-width: 2; marker-end: url(#arrow); }
      .backup, .message { fill: none; stroke: #626a73; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="2629" fill="#fff"/>
  <rect class="boundary" x="10" y="642" width="940" height="1413"/>
  <text class="title" x="480" y="38">Administración, acceso y ejecución de migraciones</text>
  <rect class="node" x="30" y="80" width="420" height="257"/>
  <text class="heading" x="240.0" y="113">Mac de Ale · administración</text>
  <text class="" x="240.0" y="147">Gentle Shell + Pi local</text>
  <text class="" x="240.0" y="173">Fuentes de configuración, kit y</text>
  <text class="" x="240.0" y="199">guías</text>
  <text class="note" x="240.0" y="225">Cambios y publicación con permiso</text>
  <text class="note" x="240.0" y="251">humano</text>
  <text class="note" x="240.0" y="277">Cuenta administradora distinta de los</text>
  <text class="note" x="240.0" y="303">devs</text>
  <rect class="node" x="510" y="80" width="420" height="179"/>
  <text class="heading" x="720.0" y="113">Computadora de cada usuario</text>
  <text class="" x="720.0" y="147">Windows · Linux · macOS</text>
  <text class="" x="720.0" y="173">Terminal SSH + cloudflared</text>
  <text class="note" x="720.0" y="199">Navegador: identidad en Access</text>
  <text class="note" x="720.0" y="225">Clave SSH propia para su cuenta Linux</text>
  <path class="flow" d="M450 208.5H480V397H720V427"/>
  <path class="flow" d="M720 259V427"/>
  <path class="backup" d="M240 337V427"/>
  <rect class="pending" x="30" y="427" width="420" height="130"/>
  <text class="heading" x="240.0" y="460">Tailscale · respaldo</text>
  <text class="heading" x="240.0" y="489">administrativo</text>
  <text class="note" x="240.0" y="523">Ruta independiente de Cloudflare</text>
  <rect class="node" x="510" y="427" width="420" height="127"/>
  <text class="heading" x="720.0" y="460">Cloudflare Access</text>
  <text class="" x="720.0" y="494">Identidad y política de acceso</text>
  <text class="note" x="720.0" y="520">No sustituye la clave SSH</text>
  <text class="title" x="480" y="682">PC-ALE · servidor Linux multiusuario</text>
  <rect class="node" x="30" y="737" width="420" height="127"/>
  <text class="heading" x="240.0" y="770">SSH: cuenta y clave del usuario</text>
  <text class="note" x="240.0" y="804">Sin contraseña ni root por SSH</text>
  <text class="note" x="240.0" y="830">Usuarios sin sudo ni Docker</text>
  <rect class="node" x="510" y="737" width="420" height="153"/>
  <text class="heading" x="720.0" y="770">Cloudflare Tunnel</text>
  <text class="" x="720.0" y="804">Contenedor existente de</text>
  <text class="" x="720.0" y="830">cloudflared</text>
  <text class="note" x="720.0" y="856">Conexión saliente hacia Cloudflare</text>
  <path class="backup" d="M240 557V612H20V777H30"/>
