<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Proceso de migración: actores, etapas y decisiones</title>
  <desc id="desc">Esquema tipo BPMN simplificado, no ejecutable. El usuario aporta la entrada; coordinación acuerda el plan. El equipo técnico adapta y prueba el código mientras el proveedor actualiza la base. Si las pruebas fallan, se vuelve a adaptar. Con entrega y restauración autorizadas se valida la historia; un rechazo vuelve a validación. Se ensaya el corte y el propietario decide autorizarlo o posponerlo. Solo una autorización específica permite el corte y seguimiento.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#626a73"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #212326; font-size: 16px; text-anchor: middle; }
      .heading { font-size: 19px; font-weight: 700; fill: #750014; }
      .note { font-size: 14px; fill: #626a73; }
      .lane { fill: #fff; stroke: #dde1e6; }
      .task { fill: #f2f4f8; stroke: #626a73; stroke-width: 1.5; rx: 8; }
      .gateway { fill: #fff; stroke: #750014; stroke-width: 2; }
      .event { fill: #fff; stroke: #750014; stroke-width: 2; }
      .flow { fill: none; stroke: #626a73; stroke-width: 1.8; marker-end: url(#arrow); }
      .message { fill: none; stroke: #626a73; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1040" fill="#fff"/>
  <rect class="lane" x="20" y="20" width="280" height="980"/>
  <rect class="lane" x="310" y="20" width="280" height="980"/>
  <rect class="lane" x="600" y="20" width="280" height="980"/>
  <rect class="lane" x="890" y="20" width="290" height="980" stroke-dasharray="7 5"/>
  <path d="M20 80H1180" stroke="#dde1e6"/>
  <text class="heading" x="160" y="52">Usuario</text>
  <text class="heading" x="450" y="52">Coordinación</text>
  <text class="heading" x="740" y="52">Equipo técnico</text>
  <text class="heading" x="1035" y="52">Proveedor</text>
  <text class="note" x="160" y="73">Propietario y referentes</text>
  <text class="note" x="740" y="73">Incluye plataforma y verificación</text>
  <text class="note" x="1035" y="73">Participante externo</text>

  <path class="flow" d="M160 124V145"/>
  <path class="flow" d="M255 178H350"/>
  <path class="flow" d="M450 211V230"/>
  <path class="flow" d="M470 250H740V290"/>
  <path class="message" d="M450 270V280H1035V290"/>
  <text class="note" x="1035" y="262">Solicitud de actualización</text>
  <path class="flow" d="M740 360V380"/>
  <path class="flow" d="M710 410H620V325H650"/>
  <text class="note" x="637" y="400">No: corregir</text>
  <path class="flow" d="M740 440V450H160V465"/>
  <text class="note" x="450" y="443">Sí: preparar validación histórica</text>
  <path class="flow" d="M255 495H600V535H650"/>
  <path class="message" d="M1035 360V480H850V535H830"/>
  <text class="note" x="1035" y="448">Entrega y cobertura</text>
  <text class="note" x="1035" y="470">Esperar si faltan</text>
  <path class="flow" d="M650 550H310V625H190"/>
  <path class="flow" d="M130 625H45V575H620V550H650"/>
  <text class="note" x="80" y="610">No</text>
  <path class="flow" d="M160 655V710H650"/>
  <text class="note" x="450" y="700">Sí: historia aceptada</text>
  <path class="flow" d="M740 745V765H160V790"/>
  <path class="flow" d="M190 820H650"/>
  <text class="note" x="450" y="809">Sí: autorización específica</text>
  <path class="flow" d="M130 820H80V928"/>
  <text class="note" x="62" y="850">No</text>
  <path class="flow" d="M740 855V928"/>

  <circle class="event" cx="160" cy="112" r="12"/>
  <rect class="task" x="65" y="145" width="190" height="66"/>
  <text x="160" y="172"><tspan font-weight="700">1. Entrada</tspan><tspan x="160" dy="23">Contexto y límites</tspan></text>
  <rect class="task" x="350" y="145" width="200" height="66"/>
  <text x="450" y="172"><tspan font-weight="700">2. Plan</tspan><tspan x="450" dy="23">Alcance y dependencias</tspan></text>
  <polygon class="gateway" points="450,230 470,250 450,270 430,250"/>
  <text x="450" y="256">+</text>
  <text class="note" x="370" y="255">En paralelo</text>
  <rect class="task" x="650" y="290" width="180" height="70"/>
  <text x="740" y="315"><tspan font-weight="700">3. Código</tspan><tspan x="740" dy="24">Adaptar y probar</tspan></text>
  <rect class="task" x="935" y="290" width="200" height="70"/>
  <text x="1035" y="315">Actualizar la base<tspan x="1035" dy="24">según cobertura</tspan></text>
  <polygon class="gateway" points="740,380 770,410 740,440 710,410"/>
  <text x="740" y="415">¿OK?</text>
  <text class="note" x="830" y="415">Pruebas</text>
  <rect class="task" x="65" y="465" width="190" height="60"/>
  <text x="160" y="490">Autorizar restauración<tspan x="160" dy="23">aislada en Staging</tspan></text>
  <rect class="task" x="650" y="500" width="180" height="70"/>
  <text x="740" y="525"><tspan font-weight="700">4. Historia</tspan><tspan x="740" dy="24">Validar y conciliar</tspan></text>
  <text class="note" x="160" y="590">¿Historia aceptada?</text>
  <polygon class="gateway" points="160,595 190,625 160,655 130,625"/>
  <text x="160" y="631">?</text>
  <rect class="task" x="650" y="675" width="180" height="70"/>
  <text x="740" y="700"><tspan font-weight="700">5. Ensayo</tspan><tspan x="740" dy="24">Corte y recuperación</tspan></text>
  <polygon class="gateway" points="160,790 190,820 160,850 130,820"/>
  <text x="160" y="826">?</text>
  <text class="note" x="175" y="878">¿Autoriza corte?</text>
  <rect class="task" x="650" y="785" width="180" height="70"/>
  <text x="740" y="810"><tspan font-weight="700">6. Corte</tspan><tspan x="740" dy="24">Ejecutar y acompañar</tspan></text>
  <circle class="event" cx="80" cy="942" r="14"/>
  <text class="note" x="110" y="980">Posponer; resolver pendientes</text>
  <circle class="event" cx="740" cy="942" r="14" stroke-width="4"/>
  <text class="note" x="740" y="980">Seguimiento y cierre</text>
  <text class="note" x="600" y="1024">Esquema simplificado. Cada operación requiere su permiso; no representa el avance de un caso real.</text>
</svg>
