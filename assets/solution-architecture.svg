  <text class="heading" x="480.0" y="1072.4">Casos · /srv/migraciones/cases/MIG-CLIENTE-001</text>
  <text class="" x="480.0" y="1096.2">Intake · tablero · runbook · clones y worktrees</text>
  <text class="note" x="480.0" y="1114.4">Un coordinador por caso; lock operativo, no barrera de seguridad</text>
  <path class="flow" d="M240 996.8V1049.3"/>
  <path class="flow" d="M720 942.2V1049.3"/>
  <rect class="pending" x="50" y="1190.7" width="860" height="88.9"/>
  <text class="heading" x="480.0" y="1213.8">Engram instalado · activación y aislamiento pendientes</text>
  <text class="note" x="480.0" y="1237.6">No es una memoria compartida validada.</text>
  <text class="note" x="480.0" y="1255.8">El tablero y el runbook mantienen la continuidad.</text>
  <rect class="node" x="50" y="1321.6" width="860" height="88.9"/>
  <text class="heading" x="480.0" y="1344.7">Servicios que conviven</text>
  <text class="" x="480.0" y="1368.5">Buzz y Odoo existentes</text>
  <text class="note" x="480.0" y="1386.7">Sin reconfiguración por esta solución</text>
