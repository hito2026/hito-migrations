  <text class="" x="720.0" y="102.9">Windows · Linux · macOS</text>
  <text class="" x="720.0" y="121.1">Terminal SSH + cloudflared</text>
  <text class="note" x="720.0" y="139.3">Navegador: identidad en Access</text>
  <text class="note" x="720.0" y="157.5">Clave SSH propia para su cuenta Linux</text>
