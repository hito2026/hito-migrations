  <text class="note" x="240.0" y="175.7">humano</text>
  <text class="note" x="240.0" y="193.9">Cuenta administradora distinta de los</text>
  <text class="note" x="240.0" y="212.1">devs</text>
  <rect class="node" x="510" y="56" width="420" height="125.3"/>
