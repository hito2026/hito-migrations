site_name: Hito migrations
site_description: >-
  Esquemas y plantillas de migración de Odoo aptos para publicación pública
site_url: https://hito2026.github.io/hito-migrations/
theme:
  name: material
  custom_dir: overrides
  language: es
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
extra:
  documentation:
    version: "0.3.1"
    updated: "2026-10-25"
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - attr_list
  - md_in_html
plugins:
  - search:
      lang: es
not_in_nav: |
  /migration-manual.md
  /migration-templates.md
  /versions.md
  /recipes.md
  /validation.md
  /known-errors.md
  /upgraded-db-lessons.md
  /ai-guide.md
  /case-template.md
  /user-instructions.md
  /architecture.md
  /spiral-strategy.md
nav:
  - Migrando:
      - Introducción: index.md
      - Procedimiento: procedure.md
      - Gentle Shell: gentle-shell.md
